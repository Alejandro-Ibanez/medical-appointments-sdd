    Cita:
      type: object
      description: >-
        Representa una cita medica. Contiene referencias limpias y
        completas hacia el paciente y el medico asignados, evitando
        duplicar su definicion.
      required:
        - id
        - paciente
        - medico
        - fechaHora
        - estado
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        paciente:
          $ref: '#/components/schemas/Paciente'
        medico:
          $ref: '#/components/schemas/Medico'
        fechaHora:
          type: string
          format: date-time
          example: '2026-03-10T09:30:00Z'
        estado:
          $ref: '#/components/schemas/EstadoCita'
        motivo:
          type: string
          example: Control anual
        observaciones:
          type: string
          example: Paciente refiere molestias leves
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true

    CrearCitaRequest:
      type: object
      description: Datos requeridos para agendar una nueva cita medica
      required:
        - pacienteId
        - medicoId
        - fechaHora
        - motivoConsulta
      properties:
        pacienteId:
          type: integer
          format: int64
          example: 1
        medicoId:
          type: integer
          format: int64
          example: 1
        fechaHora:
          type: string
          format: date-time
          example: '2026-03-10T09:30:00Z'
        motivoConsulta:
          type: string
          example: Control anual

    CancelarCitaRequest:
      type: object
      description: Datos requeridos para cancelar una cita medica existente
      required:
        - motivoCancelacion
      properties:
        motivoCancelacion:
          type: string
          example: El paciente solicito reprogramar la consulta

    PacienteResumenCita:
      type: object
      description: Resumen del paciente embebido en el detalle de una cita
      required:
        - id
        - nombreCompleto
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nombreCompleto:
          type: string
          example: Maria Gonzalez
        alergias:
          type: string
          nullable: true
          example: Penicilina

    MedicoResumenCita:
      type: object
      description: Resumen del medico embebido en el detalle de una cita
      required:
        - id
        - nombreCompleto
        - especialidad
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nombreCompleto:
          type: string
          example: Dr. Carlos Ramirez
        especialidad:
          type: string
          example: Cardiologia

    CitaDetalleResponse:
      type: object
      description: >-
        Representacion detallada de una cita medica, incluyendo un resumen
        del paciente y del medico asignados.
      required:
        - id
        - fechaHora
        - motivoConsulta
        - estado
        - paciente
        - medico
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        fechaHora:
          type: string
          format: date-time
          example: '2026-03-10T09:30:00Z'
        motivoConsulta:
          type: string
          example: Control anual
        estado:
          $ref: '#/components/schemas/EstadoCita'
        paciente:
          $ref: '#/components/schemas/PacienteResumenCita'
        medico:
          $ref: '#/components/schemas/MedicoResumenCita'

    CitaCalendarioResponse:
      type: object
      description: >-
        Representacion simplificada de una cita, lista para dibujarse como
        evento en un componente de calendario (ej. FullCalendar).
      required:
        - id
        - title
        - start
        - estado
        - pacienteId
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          description: Titulo del evento, listo para mostrarse en el calendario
          example: Maria Gonzalez - Control anual
        start:
          type: string
          format: date-time
          description: Fecha y hora de inicio de la cita
          example: '2026-09-10T09:30:00Z'
        end:
          type: string
          format: date-time
          description: Fecha y hora de fin estimada de la cita
          example: '2026-09-10T10:00:00Z'
        estado:
          $ref: '#/components/schemas/EstadoCita'
        pacienteId:
          type: integer
          format: int64
          description: >-
            Identificador del paciente, necesario para poder consultar su
            historial clinico desde el detalle del evento
          example: 1
        pacienteNombre:
          type: string
          example: Maria Gonzalez
        medicoNombre:
          type: string
          example: Dr. Carlos Ramirez

    HistorialClinicoResponse:
      type: object
      description: Una entrada del historial clinico de un paciente
      required:
        - id
        - fechaHora
        - medicoNombre
        - diagnostico
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        fechaHora:
          type: string
          format: date-time
          description: Fecha y hora en que se registro la entrada clinica
          example: '2026-09-10T10:15:00Z'
        medicoNombre:
          type: string
          description: Nombre del medico que registro la entrada
          example: Dr. Carlos Ramirez
        diagnostico:
          type: string
          example: Hipertension arterial controlada
        tratamiento:
          type: string
          example: Losartan 50mg cada 24 horas
        notas:
          type: string
          description: Notas clinicas adicionales del medico
          example: Paciente refiere buena adherencia al tratamiento previo

    HistorialClinicoInput:
      type: object
      description: Datos requeridos para registrar una nueva entrada del historial clinico
      required:
        - diagnostico
      properties:
        diagnostico:
          type: string
          example: Hipertension arterial controlada
        tratamiento:
          type: string
          example: Losartan 50mg cada 24 horas
        notas:
          type: string
          example: Paciente refiere buena adherencia al tratamiento previo
        citaId:
          type: integer
          format: int64
          nullable: true
          description: >-
            Identificador opcional de la cita medica que origino esta
            entrada del historial clinico. Cuando se envia, el backend
            marca automaticamente esa cita como 'Completada'.
          example: 12
