<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-800">Registrar nuevo usuario</h2>
      <button type="button" class="text-gray-400 hover:text-gray-600" (click)="cancelar()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
        <input type="text" formControlName="nombreCompleto"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" formControlName="username" autocomplete="off"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" formControlName="password" autocomplete="new-password"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
        <select formControlName="rolId"
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option [value]="0" disabled>Selecciona un rol</option>
          @for (rol of roles(); track rol.id) {
            <option [value]="rol.id">{{ rol.nombre }}</option>
          }
        </select>
      </div>

      @if (mostrarSelectorMedico()) {
        <div class="rounded-md border border-blue-100 bg-blue-50 p-4">
          <label class="block text-sm font-medium text-blue-800 mb-1">🩺 Médico a vincular</label>
          <select formControlName="medicoId"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [value]="0" disabled>Selecciona un médico</option>
            @for (medico of medicosDisponibles(); track medico.id) {
              <option [value]="medico.id">{{ medico.nombreCompleto }} · {{ medico.especialidad }}</option>
            }
          </select>
          <p class="mt-2 text-xs text-blue-700">
            Esta cuenta quedara enlazada al registro de medico seleccionado.
          </p>
        </div>
      }

      @if (error()) {
        <div class="rounded-md bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">
          {{ error() }}
        </div>
      }

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="cancelar()"
                class="px-4 py-2 text-sm font-medium rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">
          Cancelar
        </button>
        <button type="submit" [disabled]="guardando()"
                class="px-4 py-2 text-sm font-medium rounded-md bg-blue-600 text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
          {{ guardando() ? 'Guardando...' : '✓ Registrar usuario' }}
        </button>
      </div>
    </form>
  </div>
</div>
