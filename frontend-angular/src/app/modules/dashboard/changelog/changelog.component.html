<div class="sticky top-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-base font-semibold text-slate-800">Novedades del sistema</h2>
  <p class="mt-1 text-xs text-slate-500">
    Historial de versiones: lo ya disponible y lo que viene a continuación.
  </p>

  <ol class="relative mt-5 space-y-5 border-l-2 border-slate-200 pl-5 text-sm">
      @for (entrada of entradas; track entrada.id) {
        <li class="relative">
          <span
            class="absolute -left-[1.65rem] top-1 h-3.5 w-3.5 rounded-full ring-4 ring-white"
            [ngClass]="puntoEstado(entrada.estado)"
          ></span>

          <button
            type="button"
            (click)="alternar(entrada.id)"
            class="flex w-full items-start justify-between gap-3 rounded-lg text-left transition hover:opacity-80"
          >
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-mono text-sm font-semibold text-slate-800">{{ entrada.version }}</span>
                <span class="text-sm font-medium text-slate-700">{{ entrada.titulo }}</span>
                <span
                  class="inline-flex rounded-full px-2 py-0.5 text-xs font-medium"
                  [ngClass]="estiloEstado(entrada.estado)"
                >
                  {{ etiquetaEstado(entrada.estado) }}
                </span>
              </div>
              <p class="mt-0.5 text-xs text-slate-400">{{ entrada.fecha }}</p>
            </div>

            <span class="mt-1 shrink-0 text-slate-400 transition" [class.rotate-180]="expandido() === entrada.id">
              ▾
            </span>
          </button>

          @if (expandido() === entrada.id) {
            <ul class="mt-3 space-y-1.5 rounded-lg bg-slate-50 p-4 text-sm text-slate-600">
              @for (cambio of entrada.cambios; track cambio) {
                <li class="flex gap-2">
                  <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-slate-400"></span>
                  <span>{{ cambio }}</span>
                </li>
              }
            </ul>
          }
        </li>
      }
  </ol>
</div>
